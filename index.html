<!-- ТЕК sendStatus және track бөлігі өзгерді, бірақ толық файлды беремін -->
<script>
// ... жоғарыдағы код сол күйі қалады, тек төмендегі 2 функцияны ауыстыр

async function loadOrders(force){
 try{
  const res=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1'); const text=await res.text(); const lines=text.trim().split('\n').filter(Boolean);
  const all=lines.map(l=>{try{return JSON.parse(l)}catch{return null}}).filter(x=>x&&x.message).reverse();
  const orders=all.filter(o=>!o.message.startsWith('JOLDA')&&!o.message.startsWith('KELDI')&&!o.message.startsWith('TRIP')&&!o.message.startsWith('DONE')&&o.message.includes('→'));
  const list=document.getElementById('ordersList'); document.getElementById('cnt').textContent=orders.length;
  if(orders.length===0){list.innerHTML='<p style="color:#888;padding:20px;text-align:center">Әзірге тапсырыс жоқ</p>';return}
  const newest=orders[0].id||''; if(newest!==lastOrderId && lastOrderId!==''){playBeepOnce(newest);} if(force && lastOrderId==='' && orders.length>0){playBeepOnce(newest);} lastOrderId=newest;
  list.innerHTML='';
  orders.slice(0,30).forEach(o=>{
   const p=o.message.split('|'); if(p.length<3) return;
   const route=p[0]||'', price=p[1]||'', phone=p[2]||'', time=p[3]||'', persons=p[4]||'1', pay=p[5]||'', bag=p[6]||'', fromDet=p[7]||'', toDet=p[8]||'';
   const isKaspi=pay.includes('Kaspi'); const hasBag=bag.includes('+');
   // Соңғы статусты білу үшін localStorage-тан аламыз
   const lastSt = localStorage.getItem('qj_status_'+phone) || 'new';
   const d=document.createElement('div'); d.className='order-card';
   d.style.borderLeftColor = lastSt==='jolda'?'#FFB700':lastSt==='keldi'?'#0a84ff':lastSt==='trip'?'#25D366':lastSt==='done'?'#888':'#FFB700';
   d.innerHTML=`<div style="display:flex;justify-content:space-between"><b>${route}</b><span style="color:${isKaspi?'#0a84ff':'#FFB700'}">${price}тг • ${pay}</span></div>
   <div style="font-size:11px;color:#ccc;margin:6px 0;background:#222;padding:8px;border-radius:8px">📍 ${fromDet}<br>🏁 ${toDet}</div>
   <span class="badge" style="background:#0a84ff">${persons} адам</span><span class="badge" style="background:${hasBag?'#ff3b30':'#444'}">${bag}</span><span class="badge" style="background:#333">Статус: ${lastSt}</span><br>
   📞 <a href="tel:${phone}" style="color:#25D366;font-size:18px;font-weight:800">${phone}</a> • ${time}
   <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px">
   ${lastSt==='new'?`<button onclick="sendStatus('${phone}','jolda','${route}','${price}','${pay}')" style="background:#FFB700;color:#111;padding:12px;border-radius:10px;border:none;font-weight:800">🟢 Алдым • Жолдамын</button>`:''}
   ${lastSt==='jolda'?`<button onclick="sendStatus('${phone}','keldi','${route}')" style="background:#0a84ff;color:#fff;padding:12px;border-radius:10px;border:none">📍 Келдім - клиентке жеттім</button>`:''}
   ${lastSt==='keldi'?`<button onclick="sendStatus('${phone}','trip','${route}')" style="background:#25D366;color:#fff;padding:12px;border-radius:10px;border:none;font-weight:800">🛣️ Жолға шықтық - Астанаға</button>`:''}
   ${lastSt==='trip'?`<button onclick="sendStatus('${phone}','done','${route}','${price}','${pay}')" style="background:#111;color:#0f0;border:2px solid #0f0;padding:12px;border-radius:10px;font-weight:800">✅ Жеттік - Тапсырыс бітті</button>`:''}
   <a href="tel:${phone}" style="background:#333;color:#fff;padding:10px;border-radius:10px;text-align:center;text-decoration:none;font-size:12px">📞 Қоңырау</a>
   </div>`;
   list.appendChild(d);
  });
 }catch(e){console.log(e)}
}

async function sendStatus(phone,status,route,price,pay){
 const now=Date.now();
 let body='';
 if(status==='jolda') body=`JOLDA|${route}|${phone}|${now}`;
 if(status==='keldi') body=`KELDI|${route}|${phone}|${now}`;
 if(status==='trip') body=`TRIP|${route}|${phone}|${now}`;
 if(status==='done') body=`DONE|${route}|${phone}|${now}`;
 await fetch('https://ntfy.sh/'+TOPIC,{method:'POST',body:body});
 localStorage.setItem('qj_status_'+phone, status);
 if(status==='done' && price){ addToKassa(price,pay); }
 if(status==='trip'){ speakOnce('Жолға шықтық'); }
 stopAlarm();
 if(status==='jolda') alert('✅ Клиентке "Жолдамын" кетті!');
 if(status==='keldi') alert('✅ "Келдім" кетті! Клиент түсіп жатыр');
 if(status==='trip') alert('🛣️ "Жолға шықтық" кетті! Клиент жолда');
 if(status==='done') alert('✅ "Жеттік"! Тапсырыс жабылды, кассаға түсті: '+price+'тг');
}

function startClientListener(){
 const myPhone=localStorage.getItem('qj_phone'); const orderTime=parseInt(localStorage.getItem('qj_order_time')||'0'); if(!myPhone) return; clientOrderTime=orderTime; lastClientStatus=localStorage.getItem('qj_last_status')||'';
 setInterval(async()=>{ try{
  const res=await fetch('https://ntfy.sh/'+TOPIC+'/json?poll=1'); const text=await res.text(); const lines=text.trim().split('\n').filter(Boolean).reverse();
  for(let l of lines){ try{
   const j=JSON.parse(l); if(!j.message) continue; if(j.message===lastClientStatus) continue; if(!j.message.includes(myPhone)) continue;
   const parts=j.message.split('|'); const msgTime=parseInt(parts[parts.length-1]||'0'); if(msgTime && msgTime < clientOrderTime) continue;
   if(j.message.startsWith('JOLDA')){ trackUpdate('🚗 Ақжол жолда!','10 минутта жетеді • +7 708 742 6861','🚗💨','65%','10:00'); speakOnce('Көлік жолда'); saveStatus(j); break; }
   if(j.message.startsWith('KELDI')){ trackUpdate('📍 Көлік келді!','Төмен түсіңіз, көлік күтіп тұр','📍🚕','85%','КЕЛДІ'); speakOnce('Көлік келді, шығыңыз'); saveStatus(j); break; }
   if(j.message.startsWith('TRIP')){ trackUpdate('🛣️ Жолға шықтық!','Астанаға бара жатырмыз','🚕💨','90%','ЖОЛДА'); speakOnce('Жолға шықтық, аман-есен жетеміз'); saveStatus(j); break; }
   if(j.message.startsWith('DONE')){ trackUpdate('✅ Жеттік! Рахмет!','Тапсырыс орындалды. Бағалап кетіңіз','✅','100%','БІТТІ'); speakOnce('Межелі жерге жеттік, рахмет'); saveStatus(j); setTimeout(()=>{document.getElementById('trackBox').style.display='none'; localStorage.removeItem('qj_phone');}, 10000); break; }
  }catch(e){} }
 }catch(e){} },4000);
 function trackUpdate(title,text,icon,bar,timer){ document.getElementById('trackBox').style.display='block'; document.getElementById('trackTitle').textContent=title; document.getElementById('trackText').textContent=text; document.getElementById('trackIcon').textContent=icon; document.getElementById('trackBar').style.width=bar; document.getElementById('trackTimer').textContent=timer; }
 function saveStatus(j){ lastClientStatus=j.message; localStorage.setItem('qj_last_status',j.message); }
}
</script>
